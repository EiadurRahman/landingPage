######################## default configuration ####################
baseURL = "/"
title = "UrbanArch | cofee"
theme = "omega-hugo"
# google analytics
# google_analytics = "G-XXXXXXXXXX" # example : UA-123-45
[markup.goldmark.renderer]
unsafe= true


#################### default parameters ################################
[params]
# title
site_title = "UrbanArch"
favicon = "images/favicon.png"


# logo = "images/logo.png"
logo = "images/logo-bgW.png"
logo_width = "120px"
# Meta data
description = "This is meta description"
author = "Eiadur Rahman"
# contact info
contact_info = "1001 Brickell bay <br>Dr. Miami, <br>FL 33131"
# Preloader
preloader = true
# google map
[params.map]
enable = false
gmap_api = "https://maps.googleapis.com/maps/api/js?key=AIzaSyCC72vZw-6tGqFyRhhg5CkF2fqfILn2Tsw"
map_center_lat = "25.773606"
map_center_lng = "-80.732655"
map_position_lat = "25.7635916"
map_position_lng = "-80.1937595"
map_marker = "images/map-marker.png"

# cookies
[params.cookies]
enable = true
expire_days = 2

